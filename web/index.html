<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#070b16">
  <title>صيّاد العروض · أمازون مصر</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B7%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Tajawal', 'system-ui', 'Segoe UI', 'Tahoma', 'sans-serif'] },
          colors: { ink: { 950: '#070b16', 900: '#0c1222', 800: '#121a2e', 700: '#1b2540' } },
        },
      },
    };
  </script>
  <style>
    body {
      background:
        radial-gradient(900px 480px at 85% -10%, rgba(251, 191, 36, .13), transparent 60%),
        radial-gradient(700px 420px at 0% 0%, rgba(16, 185, 129, .10), transparent 60%),
        #070b16;
      background-attachment: fixed;
    }
    .num { font-variant-numeric: tabular-nums; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .card { animation: rise .35s ease both; }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  </style>
</head>
<body class="min-h-screen font-sans text-slate-100 antialiased">
  <div class="mx-auto max-w-7xl px-4 pb-16 sm:px-6">

    <!-- Header -->
    <header class="flex flex-wrap items-center justify-between gap-4 py-6 sm:py-8">
      <div class="flex items-center gap-3">
        <div class="grid h-12 w-12 place-items-center rounded-2xl bg-amber-400 text-2xl shadow-lg shadow-amber-500/20">🏷️</div>
        <div>
          <h1 class="text-2xl font-black leading-tight sm:text-3xl">صيّاد العروض</h1>
          <p class="text-sm text-slate-400">أمازون مصر · مستعمل وعلبة مفتوحة</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span id="status" class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-bold text-slate-300 sm:text-sm">
          <span id="status-dot" class="h-2 w-2 rounded-full bg-slate-500"></span>
          <span id="status-text">جارِ التحميل…</span>
        </span>
        <button id="refresh" type="button" title="تحديث" aria-label="تحديث"
          class="grid h-9 w-9 place-items-center rounded-full border border-white/10 bg-white/5 text-slate-300 transition hover:border-amber-400/60 hover:text-amber-300">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </header>

    <!-- Stats -->
    <section class="grid grid-cols-2 gap-3 lg:grid-cols-4">
      <div class="rounded-2xl border border-white/10 bg-ink-900/70 p-4">
        <p class="text-xs text-slate-400 sm:text-sm">عروض متاحة الآن</p>
        <p id="stat-count" class="num mt-1 text-2xl font-black sm:text-3xl">—</p>
      </div>
      <div class="rounded-2xl border border-white/10 bg-ink-900/70 p-4">
        <p class="text-xs text-slate-400 sm:text-sm">أعلى خصم</p>
        <p id="stat-top" class="num mt-1 text-2xl font-black text-emerald-400 sm:text-3xl">—</p>
      </div>
      <div class="rounded-2xl border border-white/10 bg-ink-900/70 p-4">
        <p class="text-xs text-slate-400 sm:text-sm">أقل سعر</p>
        <p id="stat-low" class="num mt-1 text-2xl font-black text-amber-300 sm:text-3xl">—</p>
      </div>
      <div class="rounded-2xl border border-white/10 bg-ink-900/70 p-4">
        <p class="text-xs text-slate-400 sm:text-sm">آخر فحص</p>
        <p id="stat-updated" class="mt-1 text-2xl font-black sm:text-3xl">—</p>
      </div>
    </section>

    <!-- Toolbar -->
    <section class="mt-5 flex flex-col gap-3 lg:flex-row lg:items-center">
      <div class="relative flex-1">
        <input id="search" type="search" placeholder="ابحث باسم المنتج…" autocomplete="off"
          class="w-full rounded-xl border border-white/10 bg-ink-900/70 px-4 py-3 text-sm outline-none transition placeholder:text-slate-500 focus:border-amber-400/70">
      </div>
      <div id="ranges" class="flex gap-2 overflow-x-auto pb-1 lg:pb-0"></div>
      <select id="sort" aria-label="الترتيب"
        class="rounded-xl border border-white/10 bg-ink-900 px-4 py-3 text-sm font-bold outline-none transition focus:border-amber-400/70">
        <option value="discount">الأعلى خصماً</option>
        <option value="newest">الأحدث</option>
        <option value="price-asc">الأرخص</option>
        <option value="price-desc">الأغلى</option>
        <option value="saving">الأكثر توفيراً</option>
      </select>
    </section>

    <!-- Messages -->
    <div id="error" class="mt-5 hidden rounded-2xl border border-rose-500/30 bg-rose-500/10 p-4 text-sm text-rose-200"></div>
    <div id="empty" class="mt-8 hidden rounded-3xl border border-dashed border-white/15 bg-ink-900/50 px-6 py-16 text-center">
      <div class="text-5xl">🔎</div>
      <h2 id="empty-title" class="mt-4 text-xl font-black">لا توجد عروض مطابقة الآن</h2>
      <p id="empty-text" class="mx-auto mt-2 max-w-md text-sm leading-7 text-slate-400"></p>
    </div>

    <!-- Deals -->
    <main id="grid" class="mt-5 grid grid-cols-2 gap-3 sm:gap-5 lg:grid-cols-3 xl:grid-cols-4"></main>

    <footer class="mt-10 border-t border-white/10 pt-5 text-center text-xs leading-6 text-slate-500">
      <p id="foot-filters"></p>
      <p id="foot-sweep"></p>
      <p>الأسعار والتوافر بتتغير بسرعة — راجع السعر والحالة في صفحة أمازون قبل الشراء.</p>
    </footer>
  </div>

  <script>
    'use strict';

    const RANGES = [
      { id: 'all', label: 'كل الأسعار', test: () => true },
      { id: 'lt100', label: 'أقل من 100', test: (p) => p < 100 },
      { id: '100-300', label: '100 – 300', test: (p) => p >= 100 && p < 300 },
      { id: '300-600', label: '300 – 600', test: (p) => p >= 300 && p < 600 },
      { id: 'gt600', label: '600 فأكثر', test: (p) => p >= 600 },
    ];
    const view = { deals: [], meta: {}, q: '', sort: 'discount', range: 'all' };
    const $ = (id) => document.getElementById(id);
    const nf = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });
    const money = (v) => nf.format(v) + ' ج.م';

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    }

    function ago(isoString) {
      const t = Date.parse(isoString);
      if (Number.isNaN(t)) return '—';
      const minutes = Math.max(0, Math.round((Date.now() - t) / 60000));
      if (minutes < 2) return 'الآن';
      if (minutes < 60) return 'منذ ' + minutes + ' د';
      const hours = Math.round(minutes / 60);
      if (hours < 24) return 'منذ ' + hours + ' س';
      return 'منذ ' + Math.round(hours / 24) + ' يوم';
    }

    function minutesSince(isoString) {
      const t = Date.parse(isoString);
      return Number.isNaN(t) ? Infinity : (Date.now() - t) / 60000;
    }

    const safeLink = (url) => (typeof url === 'string' && /^https:\/\/www\.amazon\.eg\//.test(url) ? url : null);
    const safeImage = (url) => (typeof url === 'string' && /^https:\/\/[a-z0-9.-]+\.(media-amazon|ssl-images-amazon)\.com\//.test(url) ? url : null);

    function card(deal, index) {
      const link = safeLink(deal.url);
      const root = el('article', 'card group flex flex-col overflow-hidden rounded-2xl border border-white/10 bg-ink-900/80 transition hover:-translate-y-0.5 hover:border-amber-400/50 hover:shadow-xl hover:shadow-amber-500/5');
      root.style.animationDelay = Math.min(index, 12) * 30 + 'ms';

      const media = el('a', 'relative block aspect-square bg-white');
      if (link) { media.href = link; media.target = '_blank'; media.rel = 'noopener noreferrer'; }
      const src = safeImage(deal.image);
      if (src) {
        const img = el('img', 'h-full w-full object-contain p-4 transition duration-300 group-hover:scale-105');
        img.src = src; img.alt = ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
        media.append(img);
      } else {
        media.append(el('div', 'grid h-full w-full place-items-center text-5xl', '📦'));
      }
      media.append(el('span', 'num absolute right-2 top-2 rounded-full bg-emerald-500 px-2.5 py-1 text-xs font-black text-emerald-950 shadow sm:right-3 sm:top-3 sm:text-sm', '-' + Math.floor(deal.discount) + '%'));
      if (minutesSince(deal.first_seen) < 120) {
        media.append(el('span', 'absolute left-2 top-2 rounded-full bg-rose-500 px-2.5 py-1 text-xs font-black text-white shadow sm:left-3 sm:top-3', 'جديد'));
      }
      root.append(media);

      const body = el('div', 'flex flex-1 flex-col gap-2 p-3 sm:p-4');
      body.append(el('span', 'w-fit rounded-md bg-white/5 px-2 py-0.5 text-[11px] font-bold text-slate-300 sm:text-xs', deal.condition_ar || deal.condition || 'مستعمل'));
      const title = el('h3', 'line-clamp-2 text-sm font-bold leading-6 text-slate-100 sm:text-[15px]', deal.title);
      title.dir = 'auto'; title.title = deal.title;
      body.append(title);

      const prices = el('div', 'mt-auto flex flex-wrap items-baseline gap-x-2 gap-y-0.5 pt-1');
      prices.append(el('span', 'num text-xl font-black text-amber-300 sm:text-2xl', money(deal.price)));
      prices.append(el('span', 'num text-xs text-slate-500 line-through sm:text-sm', money(deal.reference_price)));
      body.append(prices);
      body.append(el('p', 'num text-xs font-bold text-emerald-400', 'توفّر ' + money(deal.reference_price - deal.price)));

      const info = el('p', 'truncate text-[11px] text-slate-500 sm:text-xs');
      info.textContent = [deal.seller, 'اكتُشف ' + ago(deal.first_seen)].filter(Boolean).join(' · ');
      body.append(info);

      const cta = el('a', 'mt-1 block rounded-xl bg-amber-400 px-3 py-2.5 text-center text-sm font-black text-slate-950 transition hover:bg-amber-300', 'اشترِ من أمازون');
      if (link) { cta.href = link; cta.target = '_blank'; cta.rel = 'noopener noreferrer'; }
      body.append(cta);
      root.append(body);
      return root;
    }

    function visibleDeals() {
      const q = view.q.trim().toLowerCase();
      const range = RANGES.find((r) => r.id === view.range) || RANGES[0];
      const list = view.deals.filter((d) => range.test(d.price) && (!q || (d.title || '').toLowerCase().includes(q)));
      const by = {
        'discount': (a, b) => b.discount - a.discount,
        'newest': (a, b) => Date.parse(b.first_seen) - Date.parse(a.first_seen),
        'price-asc': (a, b) => a.price - b.price,
        'price-desc': (a, b) => b.price - a.price,
        'saving': (a, b) => (b.reference_price - b.price) - (a.reference_price - a.price),
      };
      return list.sort(by[view.sort] || by.discount);
    }

    function renderRanges() {
      const box = $('ranges');
      box.replaceChildren();
      for (const r of RANGES) {
        const on = r.id === view.range;
        const b = el('button', 'whitespace-nowrap rounded-full border px-3.5 py-2 text-xs font-bold transition sm:text-sm ' +
          (on ? 'border-amber-400 bg-amber-400 text-slate-950' : 'border-white/10 bg-ink-900/70 text-slate-300 hover:border-amber-400/50'), r.label);
        b.type = 'button';
        b.addEventListener('click', () => { view.range = r.id; render(); });
        box.append(b);
      }
    }

    function renderStatus() {
      const m = view.meta || {};
      const dot = $('status-dot'), text = $('status-text');
      const age = minutesSince(m.updated_at);
      let color = 'bg-slate-500', label = 'في انتظار أول تشغيل';
      if (m.updated_at) {
        if (m.status === 'blocked') { color = 'bg-rose-500'; label = 'أمازون رفض آخر محاولة · ' + ago(m.updated_at); }
        else if (age > 75) { color = 'bg-amber-400'; label = 'متأخر · آخر فحص ' + ago(m.updated_at); }
        else { color = 'bg-emerald-400'; label = 'يعمل · آخر فحص ' + ago(m.updated_at); }
      }
      dot.className = 'h-2 w-2 rounded-full ' + color;
      text.textContent = label;
      $('stat-updated').textContent = m.updated_at ? ago(m.updated_at) : '—';

      const f = m.filters || {};
      $('foot-filters').textContent = f.max_price
        ? 'الفلتر الحالي: سعر أقل من ' + nf.format(f.max_price) + ' ج.م وخصم ' + nf.format(f.min_discount) + '% أو أكثر · أمازون مصر فقط'
        : '';
      const s = m.sweep || {};
      $('foot-sweep').textContent = s.bands
        ? 'تقدّم المسح: الشريحة ' + s.band + ' من ' + s.bands + ' · دورات مكتملة: ' + (s.completed || 0)
        : '';
    }

    function render() {
      renderRanges();
      renderStatus();
      const all = view.deals;
      $('stat-count').textContent = all.length ? nf.format(all.length) : '0';
      $('stat-top').textContent = all.length ? Math.floor(Math.max(...all.map((d) => d.discount))) + '%' : '—';
      $('stat-low').textContent = all.length ? money(Math.min(...all.map((d) => d.price))) : '—';

      const list = visibleDeals();
      const grid = $('grid');
      grid.replaceChildren(...list.map(card));
      const empty = $('empty');
      empty.classList.toggle('hidden', list.length > 0);
      if (!list.length) {
        const filtered = all.length > 0;
        $('empty-title').textContent = filtered ? 'لا توجد نتائج بهذا البحث' : 'لا توجد عروض مطابقة الآن';
        $('empty-text').textContent = filtered
          ? 'جرّب تغيير كلمة البحث أو شريحة السعر.'
          : 'النظام شغّال وبيفحص أمازون مصر كل 30 دقيقة — أول ما يظهر عرض مطابق هيتعرض هنا وهيوصلك على واتساب فوراً.';
      }
    }

    async function load() {
      const btn = $('refresh');
      btn.classList.add('animate-spin');
      try {
        const res = await fetch('data/deals.json?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        view.deals = (Array.isArray(json.deals) ? json.deals : []).filter(
          (d) => d && typeof d.price === 'number' && typeof d.discount === 'number' && typeof d.reference_price === 'number');
        view.meta = json.meta || {};
        $('error').classList.add('hidden');
      } catch (err) {
        const box = $('error');
        box.textContent = 'تعذّر تحميل بيانات العروض (' + err.message + '). حاول التحديث بعد قليل.';
        box.classList.remove('hidden');
      } finally {
        btn.classList.remove('animate-spin');
        render();
      }
    }

    $('search').addEventListener('input', (e) => { view.q = e.target.value; render(); });
    $('sort').addEventListener('change', (e) => { view.sort = e.target.value; render(); });
    $('refresh').addEventListener('click', load);
    setInterval(load, 5 * 60 * 1000);   // fresh data every 5 minutes
    setInterval(renderStatus, 60 * 1000); // keep "x minutes ago" ticking
    load();
  </script>
</body>
</html>
